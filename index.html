<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffb703">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ไพลินช้อป</title>
<style>
:root{--bg:#fff7e0;--card:#fff;--ink:#3a2a12;--main:#ffb703;--main-d:#e09a00;--ok:#2a9d4a;--bad:#e5484d;--muted:#8a7a5c;--line:#f0dfae}
@media (prefers-color-scheme:dark){:root{--bg:#2a2112;--card:#3a2e19;--ink:#fff3d6;--line:#5a4824;--muted:#c9b98f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Thai","Sarabun",sans-serif;font-size:18px;user-select:none}
.view{display:none;min-height:100vh;padding:12px 16px 120px;max-width:560px;margin:0 auto}
.view.on{display:block}
h1{font-size:26px;margin:4px 0 10px}
button{font:inherit;color:inherit;border:0;border-radius:18px;padding:14px 18px;background:var(--main);color:#3a2a12;font-weight:700;cursor:pointer}
button:active{transform:scale(.96)}
button.alt{background:var(--card);border:2px solid var(--line);color:var(--ink)}
button.bad{background:var(--bad);color:#fff}
button.ok{background:var(--ok);color:#fff}
button:disabled{opacity:.4}
.card{background:var(--card);border-radius:20px;padding:12px;border:2px solid var(--line)}
#msg{position:fixed;left:16px;right:16px;top:12px;max-width:528px;margin:0 auto;padding:10px 14px;border-radius:14px;text-align:center;font-weight:700;display:none;background:rgba(0,0,0,.8);color:#fff;z-index:9}
#msg.bad{background:var(--bad)}#msg.ok{background:var(--ok)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pgrid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:18px;background:var(--card);border:2px solid var(--line);color:var(--ink);min-width:0}
.pgrid .pic{width:64px;height:64px;font-size:44px;background:var(--bg)}
.pgrid .pn{font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgrid .pp{font-size:14px;color:var(--muted);font-weight:600}
#pairCode{font-size:64px;font-weight:800;letter-spacing:10px;margin:10px 0}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}
.pic{width:54px;height:54px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden;flex:none}
.pic img{width:100%;height:100%;object-fit:cover}
.grow{flex:1;min-width:0}
.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:15px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;padding:0;font-size:22px;border-radius:12px}
.qty b{min-width:24px;text-align:center;font-size:20px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;justify-content:space-between;max-width:560px;margin:0 auto}
.bar .total{font-size:30px;font-weight:800}
.bar button{font-size:22px;padding:14px 24px}
#gear{position:fixed;top:8px;right:8px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:5;touch-action:none;overflow:hidden}
#gear i{position:absolute;left:0;bottom:0;width:100%;height:0;background:var(--main);opacity:.8}
.big{font-size:56px;font-weight:800;text-align:center;margin:6px 0}
.money{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.money button{padding:18px 0;font-size:22px;border-radius:50%;aspect-ratio:1;background:#ffd166}
.money button.note{border-radius:12px;aspect-ratio:auto;background:#9bd6a5}
.empty{text-align:center;color:var(--muted);padding:24px 0}
label{display:block;font-weight:700;margin:12px 0 4px}
input[type=text],input[type=number]{width:100%;font:inherit;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emojis button{font-size:28px;padding:6px;background:var(--card);border:2px solid var(--line)}
.emojis button.sel{border-color:var(--main-d);background:#ffe9a8}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}
#vDisplay{max-width:900px;padding-bottom:24px}
#vDisplay h1{font-size:40px;text-align:center}
#vDisplay .line{padding:14px 0}
#vDisplay .pic{width:84px;height:84px;font-size:56px}
#vDisplay .name{font-size:30px}
#vDisplay .sub{font-size:22px}
#vDisplay .lineTotal{font-size:30px;font-weight:800}
.dTotal{display:flex;justify-content:space-between;align-items:baseline;font-size:44px;font-weight:800;margin:16px 4px}
.dBig{text-align:center;font-size:48px;font-weight:800;padding:40px 0}
.dPayRow{display:flex;justify-content:space-between;font-size:34px;font-weight:700;margin:6px 4px}
#pairBox{text-align:center;margin-top:20px}
#pairBadge{font-size:14px;font-weight:600;color:var(--muted)}
</style>
</head>
<body>

<div id="gear" title="กดค้างเพื่อเข้าหน้าจัดการ"><i></i><span>⚙️</span></div>

<!-- หน้าขาย -->
<section id="vSell" class="view on">
  <h1>🛒 ไพลินช้อป <small id="pairBadge"></small></h1>
  <div id="msg"></div>
  <div class="pgrid" id="pgrid"></div>
  <div class="card" style="margin-top:12px" id="cart"></div>
  <div class="bar">
    <div><div class="sub">ยอดรวม</div><div class="total" id="sellTotal">0 บาท</div></div>
    <div style="display:flex;gap:8px"><button class="alt" id="btnClear">ล้าง</button><button class="ok" id="btnPay">จ่ายเงิน</button></div>
  </div>
</section>

<!-- หน้าจ่ายเงิน -->
<section id="vPay" class="view">
  <h1>💰 จ่ายเงิน</h1>
  <div class="card">
    <div class="sub">ยอดรวม</div><div class="big" id="payTotal">0</div>
    <div class="sub">เงินที่ได้รับ</div><div class="big" id="payGot">0</div>
    <div id="payResult" class="big"></div>
  </div>
  <div class="money" id="moneyBtns"></div>
  <div class="row"><button class="alt" id="btnReset">ล้างเงิน</button><button class="alt" id="btnExact">พอดี</button></div>
  <div class="row"><button class="alt" id="btnBack">← กลับ</button><button class="ok" id="btnDone" disabled>เสร็จแล้ว ✓</button></div>
</section>

<!-- หน้าจัดการ -->
<section id="vManage" class="view">
  <h1>⚙️ จัดการสินค้า</h1>
  <div class="row" style="margin-top:0"><button id="btnAdd">+ เพิ่มสินค้า</button></div>
  <div class="card" style="margin-top:12px" id="plist"></div>
  <h1 style="margin-top:20px">🎁 สินค้าตัวอย่าง</h1>
  <div class="row" style="margin-top:0"><button class="alt" id="btnLoadSamples">📦 โหลดตัวอย่าง 10 รายการ</button></div>
  <h1 style="margin-top:20px">📺 จอลูกค้า (ไอแพด)</h1>
  <div class="row" style="margin-top:0"><button class="alt" id="btnDisplayMode">เปิดเครื่องนี้เป็นจอลูกค้า</button><button class="alt" id="btnUnpair">ตัดการจับคู่</button></div>
  <label>รหัสจับคู่ (6 หลักที่แสดงบนจอลูกค้า)</label>
  <div class="row" style="margin-top:0"><input type="number" id="pairInput" inputmode="numeric" placeholder="123456"><button id="btnPair">จับคู่</button></div>
  <div class="row"><button class="alt" id="btnToSell">← กลับหน้าขาย</button></div>
</section>

<!-- จอลูกค้า (ไอแพด) -->
<section id="vDisplay" class="view">
  <h1>🛒 ไพลินช้อป</h1>
  <div id="dIdle" class="card" style="display:none"><div class="dBig">ยินดีต้อนรับ 😊</div></div>
  <div id="dShop" style="display:none">
    <div class="card" id="dLines"></div>
    <div class="dTotal"><span>ยอดรวม</span><span id="dTotal"></span></div>
    <div id="dPay"></div>
  </div>
  <div id="dThanks" class="card" style="display:none"><div class="dBig">ขอบคุณค่ะ/ครับ 🎉</div></div>
  <div id="pairBox" class="card">
    <div id="dStatus" class="sub">รอจับคู่ — ใส่รหัสนี้ที่หน้าจัดการในเครื่องขาย</div>
    <div id="pairCode"></div>
  </div>
</section>

<!-- หน้าแก้สินค้า -->
<section id="vEdit" class="view">
  <h1 id="editTitle">สินค้า</h1>
  <label>ชื่อสินค้า</label><input type="text" id="fName" maxlength="30">
  <label>ราคา (บาท)</label><input type="number" id="fPrice" inputmode="decimal" min="0" step="0.5">
  <label>รูป (เลือกอีโมจิ หรือถ่ายรูปจริง)</label>
  <div class="emojis" id="emojis"></div>
  <div class="row"><button class="alt" id="btnPhoto">📷 ถ่าย/เลือกรูป</button><button class="alt" id="btnNoPhoto">ใช้อีโมจิ</button></div>
  <input type="file" id="fPhoto" accept="image/*" hidden>
  <div class="row"><div class="pic" id="ePrev" style="width:80px;height:80px;font-size:52px;flex:none"></div></div>
  <div class="row"><button class="alt" id="btnCancel">ยกเลิก</button><button class="ok" id="btnSave">บันทึก</button></div>
  <div class="row"><button class="bad" id="btnDel">ลบสินค้านี้</button></div>
</section>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const EMOJIS="🍪 🍫 🍬 🍭 🍩 🧁 🍎 🍌 🍓 🍇 🥛 🧃 🍞 🥕 🍕 🍔 🍦 🧸 🚗 🎈 ⚽ 📚 ✏️ 🎨 🧩 🪀 🪁 🐶 🐱 🌸".split(" ");
const KEY="minipos.products";
let products=[],firstRun=false;try{const raw=localStorage.getItem(KEY);firstRun=raw===null;products=JSON.parse(raw||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(products))}catch(e){alert("พื้นที่เก็บข้อมูลเต็ม ลองใช้อีโมจิแทนรูปถ่าย")}};
const baht=n=>(Math.round(n*100)/100).toLocaleString("th-TH");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pic=p=>p.photo?`<img src="${p.photo}" alt="">`:esc(p.emoji||"📦");

/* เสียง */
let ac;function beep(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const beepOk=()=>beep(1200,.12), beepBad=()=>beep(250,.3);

/* หน้า */
function show(id){document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id===id));$("#gear").style.display=(id==="vSell"||id==="vDisplay")?"flex":"none";window.scrollTo(0,0);
  if(id==="vSell")renderCart();}

/* ตะกร้า */
let cart=[];
const total=()=>cart.reduce((s,c)=>{const p=products.find(x=>x.id===c.id);return s+(p?p.price*c.qty:0)},0);
function renderGrid(){
  $("#pgrid").innerHTML=products.length?products.map(p=>`<button data-id="${p.id}"><div class="pic">${pic(p)}</div><div class="pn">${esc(p.name)}</div><div class="pp">${baht(p.price)} บาท</div></button>`).join(""):'<div class="empty" style="grid-column:1/-1">ยังไม่มีสินค้า กดค้างที่ ⚙️ เพื่อเพิ่ม</div>';
}
$("#pgrid").addEventListener("click",e=>{const b=e.target.closest("button");if(b)addToCart(b.dataset.id)});
function renderCart(){
  renderGrid();
  cart=cart.filter(c=>products.some(p=>p.id===c.id));
  const el=$("#cart");
  if(!cart.length)el.innerHTML='<div class="empty">แตะสินค้าด้านบนเพื่อใส่ตะกร้า 👆</div>';
  else el.innerHTML=cart.map(c=>{const p=products.find(x=>x.id===c.id);return `<div class="line"><div class="pic">${pic(p)}</div><div class="grow"><div class="name">${esc(p.name)}</div><div class="sub">${baht(p.price)} บาท</div></div><div class="qty"><button class="alt" data-a="dec" data-id="${c.id}">−</button><b>${c.qty}</b><button data-a="inc" data-id="${c.id}">+</button><button class="bad" data-a="del" data-id="${c.id}">✕</button></div></div>`}).join("");
  $("#sellTotal").textContent=baht(total())+" บาท";
  $("#btnPay").disabled=!cart.length;
  if(stage==="shop")sync();
}
$("#cart").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const c=cart.find(x=>x.id===b.dataset.id);if(!c)return;
  if(b.dataset.a==="inc")c.qty++;
  else if(b.dataset.a==="dec"){c.qty--;if(c.qty<1)cart=cart.filter(x=>x!==c)}
  else cart=cart.filter(x=>x!==c);
  renderCart();
});
$("#btnClear").onclick=()=>{cart=[];renderCart()};

/* ใส่ตะกร้า */
let msgT;
function flash(t,cls){const m=$("#msg");m.textContent=t;m.className=cls;m.style.display="block";clearTimeout(msgT);msgT=setTimeout(()=>m.style.display="none",1400)}
function addToCart(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  const c=cart.find(x=>x.id===id);c?c.qty++:cart.push({id,qty:1});
  beepOk();flash(`${p.emoji&&!p.photo?p.emoji+" ":""}${p.name} ${baht(p.price)} บาท`,"ok");
  renderCart();
}

/* จ่ายเงิน */
let got=0;
const MONEY=[[1,0],[2,0],[5,0],[10,0],[20,1],[50,1],[100,1],[500,1]];
$("#moneyBtns").innerHTML=MONEY.map(([v,n])=>`<button class="${n?"note":""}" data-v="${v}">${v}</button>`).join("");
function renderPay(){
  const t=total();
  $("#payTotal").textContent=baht(t)+" ฿";
  $("#payGot").textContent=baht(got)+" ฿";
  const r=$("#payResult");
  if(got>=t){r.innerHTML=`<span style="color:var(--ok)">ทอน ${baht(got-t)} ฿</span>`;$("#btnDone").disabled=false}
  else{r.innerHTML=`<span style="color:var(--bad)">ยังขาด ${baht(t-got)} ฿</span>`;$("#btnDone").disabled=true}
  sync();
}
$("#btnPay").onclick=()=>{if(!cart.length)return;got=0;stage="pay";renderPay();show("vPay")};
$("#moneyBtns").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;got+=+b.dataset.v;beep(900,.06);renderPay()});
$("#btnReset").onclick=()=>{got=0;renderPay()};
$("#btnExact").onclick=()=>{got=total();renderPay()};
$("#btnBack").onclick=()=>{stage="shop";sync();show("vSell")};
$("#btnDone").onclick=()=>{stage="thanks";sync();stage="shop";cart=[];got=0;renderCart();show("vSell");setTimeout(()=>flash("ขอบคุณค่ะ/ครับ 🎉","ok"),400)};

/* หน้าจัดการ */
function renderList(){
  const el=$("#plist");
  el.innerHTML=products.length?products.map(p=>`<div class="line" data-id="${p.id}" style="cursor:pointer"><div class="pic">${pic(p)}</div><div class="grow"><div class="name">${esc(p.name)}</div><div class="sub">${baht(p.price)} บาท</div></div><span>✏️</span></div>`).join(""):'<div class="empty">ยังไม่มีสินค้า กด "+ เพิ่มสินค้า"</div>';
}
$("#plist").addEventListener("click",e=>{const l=e.target.closest(".line");if(l)openEdit(l.dataset.id)});
$("#btnAdd").onclick=()=>openEdit(null);
$("#btnToSell").onclick=()=>{renderCart();show("vSell")};

/* แก้สินค้า */
let cur=null;
$("#emojis").innerHTML=EMOJIS.map(e=>`<button data-e="${e}">${e}</button>`).join("");
function markEmoji(){document.querySelectorAll("#emojis button").forEach(b=>b.classList.toggle("sel",!cur.photo&&b.dataset.e===cur.emoji))}
function prev(){$("#ePrev").innerHTML=pic(cur);markEmoji()}
function openEdit(id){
  const p=id&&products.find(x=>x.id===id);
  cur=p?{...p}:{id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:"",price:"",emoji:"🍪",photo:null,isNew:true};
  $("#editTitle").textContent=p?"แก้สินค้า":"เพิ่มสินค้า";
  $("#fName").value=cur.name;$("#fPrice").value=cur.price;
  $("#btnDel").style.display=p?"block":"none";
  prev();show("vEdit");
}
$("#emojis").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cur.emoji=b.dataset.e;cur.photo=null;prev()});
$("#btnNoPhoto").onclick=()=>{cur.photo=null;prev()};
$("#btnPhoto").onclick=()=>$("#fPhoto").click();
$("#fPhoto").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{
    const s=160,c=document.createElement("canvas");c.width=c.height=s;
    const m=Math.min(img.width,img.height),x=(img.width-m)/2,y=(img.height-m)/2;
    c.getContext("2d").drawImage(img,x,y,m,m,0,0,s,s);
    cur.photo=c.toDataURL("image/jpeg",.7);URL.revokeObjectURL(u);prev();
  };
  img.src=u;e.target.value="";
};
$("#btnCancel").onclick=()=>{renderList();show("vManage")};
$("#btnSave").onclick=()=>{
  const name=$("#fName").value.trim(),price=parseFloat($("#fPrice").value);
  if(!name){alert("ใส่ชื่อสินค้าก่อนนะ");return}
  if(!(price>=0)){alert("ใส่ราคาก่อนนะ");return}
  cur.name=name;cur.price=price;
  const i=products.findIndex(x=>x.id===cur.id);
  const out={id:cur.id,name,price,emoji:cur.emoji,photo:cur.photo};
  i>=0?products[i]=out:products.push(out);
  save();renderList();show("vManage");
};
$("#btnDel").onclick=()=>{
  if(!confirm("ลบ \""+cur.name+"\" ใช่ไหม?"))return;
  products=products.filter(x=>x.id!==cur.id);save();renderList();show("vManage");
};

/* สินค้าตัวอย่าง (รหัสคงที่) */
const SAMPLES=[
  ["sample01","คุกกี้","🍪",10],["sample02","ช็อกโกแลต","🍫",15],["sample03","ลูกอม","🍬",2],
  ["sample04","โดนัท","🍩",20],["sample05","แอปเปิล","🍎",12],["sample06","กล้วย","🍌",5],
  ["sample07","นมกล่อง","🥛",10],["sample08","น้ำส้ม","🧃",12],["sample09","ไอศกรีม","🍦",25],
  ["sample10","ตุ๊กตาหมี","🧸",50]
].map(([id,name,emoji,price])=>({id,name,emoji,price,photo:null}));
if(firstRun){products=SAMPLES.map(x=>({...x}));save()} /* ใช้ครั้งแรก: ใส่สินค้าตัวอย่างให้เลย */
$("#btnLoadSamples").onclick=()=>{
  let n=0;SAMPLES.forEach(s=>{if(!products.some(p=>p.id===s.id)){products.push({...s});n++}});
  save();renderList();alert(n?`เพิ่มสินค้าตัวอย่าง ${n} รายการแล้ว`:"มีสินค้าตัวอย่างครบแล้ว");
};

/* ส่งข้อมูลไปจอลูกค้า (ไอแพด) ด้วย PeerJS */
let peer=null,conn=null,stage="shop",retryT;
const badge=t=>{$("#pairBadge").textContent=t};
const getPair=()=>{try{return localStorage.getItem("minipos.pairId")}catch(e){return null}};
function sync(){
  if(!conn||!conn.open)return;
  const lines=cart.map(c=>{const p=products.find(x=>x.id===c.id);return p&&{name:p.name,price:p.price,qty:c.qty,emoji:p.emoji,photo:p.photo}}).filter(Boolean);
  try{conn.send({stage,lines,total:total(),got})}catch(e){}
}
function lost(){badge("📺 หลุด ลองใหม่...");clearTimeout(retryT);retryT=setTimeout(connectDisplay,3000)}
function connectDisplay(){
  const id=getPair();
  clearTimeout(retryT);
  try{if(conn)conn.close();if(peer)peer.destroy()}catch(e){}
  conn=null;peer=null;
  if(!id||typeof Peer==="undefined"){badge("");return}
  badge("📺 กำลังเชื่อม...");
  peer=new Peer();
  peer.on("open",()=>{
    conn=peer.connect(id,{reliable:true});
    conn.on("open",()=>{badge("📺 เชื่อมแล้ว");sync()});
    conn.on("close",lost);conn.on("error",lost);
  });
  peer.on("error",lost);
}
$("#btnUnpair").onclick=()=>{
  try{localStorage.removeItem("minipos.pairId")}catch(e){}
  connectDisplay();alert("ตัดการจับคู่แล้ว");
};
$("#btnPair").onclick=()=>{
  const v=$("#pairInput").value.trim();
  if(!/^\d{6}$/.test(v)){alert("ใส่รหัส 6 หลักที่เห็นบนจอลูกค้า");return}
  try{localStorage.setItem("minipos.pairId","minipos-"+v)}catch(e){}
  $("#pairInput").value="";connectDisplay();alert("จับคู่แล้ว");
};
$("#btnDisplayMode").onclick=()=>{location.href=location.pathname+"?display"};

/* โหมดจอลูกค้า */
function initDisplay(){
  show("vDisplay");
  let id;try{id=localStorage.getItem("minipos.displayId")}catch(e){}
  const newId=()=>{const i="minipos-"+String(Math.floor(Math.random()*1e6)).padStart(6,"0");try{localStorage.setItem("minipos.displayId",i)}catch(e){}return i};
  if(!/^minipos-\d{6}$/.test(id||""))id=newId();
  $("#pairCode").textContent=id.slice(8);
  let thanksUntil=0,last={lines:[],stage:"shop"},nConn=0;
  const panels=["#dIdle","#dShop","#dThanks"];
  const only=sel=>panels.forEach(p=>$(p).style.display=(p===sel)?"block":"none");
  function draw(m){
    if(!m.lines.length){only("#dIdle");return}
    only("#dShop");
    $("#dLines").innerHTML=m.lines.map(l=>`<div class="line"><div class="pic">${l.photo?`<img src="${l.photo}" alt="">`:esc(l.emoji||"📦")}</div><div class="grow"><div class="name">${esc(l.name)}</div><div class="sub">${baht(l.price)} บาท × ${l.qty}</div></div><div class="lineTotal">${baht(l.price*l.qty)}</div></div>`).join("");
    $("#dTotal").textContent=baht(m.total)+" บาท";
    const pay=$("#dPay");
    if(m.stage==="pay"){
      const ok=m.got>=m.total;
      pay.innerHTML=`<div class="dPayRow"><span>รับเงินมา</span><span>${baht(m.got)} บาท</span></div><div class="dPayRow" style="color:${ok?"var(--ok)":"var(--bad)"}"><span>${ok?"เงินทอน":"ยังขาด"}</span><span>${baht(Math.abs(m.got-m.total))} บาท</span></div>`;
    }else pay.innerHTML="";
  }
  function onMsg(m){
    if(m.stage==="thanks"){thanksUntil=Date.now()+4000;only("#dThanks");setTimeout(()=>draw(last),4100);return}
    last=m;
    if(Date.now()<thanksUntil&&!m.lines.length)return;
    draw(m);
  }
  only("#dIdle");
  const setConn=d=>{nConn+=d?1:-1;$("#pairBox").style.display=nConn>0?"none":"block"};
  const start=()=>{
    const pr=new Peer(id);
    pr.on("connection",c=>{
      c.on("open",()=>setConn(true));
      c.on("data",onMsg);
      c.on("close",()=>setConn(false));
    });
    pr.on("error",e=>{
      $("#dStatus").textContent="เชื่อมต่อไม่ได้ ("+e.type+") กำลังลองใหม่...";
      if(e.type==="unavailable-id")newId();
      setTimeout(()=>location.reload(),4000);
    });
  };
  if(typeof Peer==="undefined")$("#dStatus").textContent="โหลดตัวเชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ต";else start();
}

/* กดค้างที่มุมเพื่อเข้าหน้าจัดการ */
(function(){
  const g=$("#gear"),bar=g.querySelector("i");let t0=0,raf=0,fired=false;
  const tick=()=>{const k=Math.min(1,(Date.now()-t0)/2000);bar.style.height=k*100+"%";
    if(k>=1&&!fired){fired=true;stop();
      if(/[?&]display/.test(location.search)){location.href=location.pathname;return}
      renderList();show("vManage");return}raf=requestAnimationFrame(tick)};
  const stop=()=>{cancelAnimationFrame(raf);bar.style.height=0};
  g.addEventListener("pointerdown",e=>{e.preventDefault();fired=false;t0=Date.now();tick()});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>g.addEventListener(ev,stop));
  g.addEventListener("contextmenu",e=>e.preventDefault());
})();

if(/[?&]display/.test(location.search)){initDisplay()}
else{renderCart();renderList();connectDisplay()}
})();
</script>
